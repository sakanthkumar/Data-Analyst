version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: data_analyst_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - LLM_BACKEND=${LLM_BACKEND:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL_REASONING=${GROQ_MODEL_REASONING:-llama-3.3-70b-versatile}
      - GROQ_MODEL_CODE=${GROQ_MODEL_CODE:-llama-3.3-70b-versatile}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_REASONING_MODEL=${OLLAMA_REASONING_MODEL:-llama3}
      - OLLAMA_CODE_MODEL=${OLLAMA_CODE_MODEL:-deepseek-coder:6.7b}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-60}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:80,http://localhost}
      - CHROMA_PERSIST_DIR=/app/backend/chroma_db
      - REPORTS_DIR=/app/backend/reports
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - chroma_data:/app/backend/chroma_db
      - reports_data:/app/backend/reports
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000}
    container_name: data_analyst_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  chroma_data:
  reports_data:

networks:
  app_network:
    driver: bridge
